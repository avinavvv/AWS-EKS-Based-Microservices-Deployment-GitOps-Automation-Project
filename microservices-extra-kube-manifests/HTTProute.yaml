apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: boutique-app
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default
      name: app-alb-gateway
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: frontend
          port: 80