deploymentMode: SingleBinary

loki:
  auth_enabled: false

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

singleBinary:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false
